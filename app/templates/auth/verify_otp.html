{% extends "base.html" %}

{% block title %}Verify OTP - SkillentHub{% endblock %}

{% block extra_css %}
<style>
    .otp-container {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
    }

    .otp-input {
        width: 52px;
        height: 60px;
        text-align: center;
        font-size: 1.5rem;
        font-weight: 600;
        border: 2px solid #e2e8f0;
        border-radius: 0.75rem;
        transition: all 0.2s;
    }

    .otp-input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        outline: none;
    }

    .otp-input.filled {
        border-color: var(--primary-color);
        background-color: #f8fafc;
    }

    .otp-input.is-invalid {
        border-color: #dc3545;
    }

    .timer-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: #f1f5f9;
        padding: 0.5rem 1rem;
        border-radius: 2rem;
        font-weight: 500;
    }

    .timer-badge.expired {
        background: #fee2e2;
        color: #dc3545;
    }

    .timer-badge.warning {
        background: #fef3c7;
        color: #d97706;
    }

    .resend-btn {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.2s;
    }

    .resend-btn:disabled,
    .resend-btn.disabled {
        color: #94a3b8;
        cursor: not-allowed;
        pointer-events: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="auth-card">
                <div class="text-center mb-4">
                    <div class="mb-3">
                        <i class="bi bi-shield-lock-fill fs-1" style="color: var(--primary-color);"></i>
                    </div>
                    <h1 class="auth-title">Verify OTP</h1>
                    <p class="auth-subtitle">
                        Enter the 6-digit code sent to<br>
                        <strong>{{ email }}</strong>
                    </p>
                </div>

                <!-- Timer -->
                <div class="text-center mb-4">
                    <span class="timer-badge" id="timerBadge">
                        <i class="bi bi-clock"></i>
                        <span id="timerText">05:00</span>
                    </span>
                </div>

                <form id="otpForm" method="POST" action="{{ url_for('auth.verify_otp') }}">
                    <!-- OTP Input Boxes -->
                    <div class="otp-container mb-4">
                        <input type="text" class="otp-input" id="otp1" name="otp1" maxlength="1" inputmode="numeric"
                            pattern="[0-9]" autocomplete="off" autofocus>
                        <input type="text" class="otp-input" id="otp2" name="otp2" maxlength="1" inputmode="numeric"
                            pattern="[0-9]" autocomplete="off">
                        <input type="text" class="otp-input" id="otp3" name="otp3" maxlength="1" inputmode="numeric"
                            pattern="[0-9]" autocomplete="off">
                        <input type="text" class="otp-input" id="otp4" name="otp4" maxlength="1" inputmode="numeric"
                            pattern="[0-9]" autocomplete="off">
                        <input type="text" class="otp-input" id="otp5" name="otp5" maxlength="1" inputmode="numeric"
                            pattern="[0-9]" autocomplete="off">
                        <input type="text" class="otp-input" id="otp6" name="otp6" maxlength="1" inputmode="numeric"
                            pattern="[0-9]" autocomplete="off">
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100 py-2" id="verifyBtn">
                        <i class="bi bi-check-circle me-2"></i>Verify OTP
                    </button>
                </form>

                <!-- Resend OTP -->
                <div class="text-center mt-4">
                    <p class="text-muted mb-2">Didn't receive the code?</p>
                    <form method="POST" action="{{ url_for('auth.resend_otp') }}" id="resendForm"
                        style="display: inline;">
                        <button type="submit" class="btn btn-link resend-btn p-0 disabled" id="resendBtn" disabled>
                            Resend OTP <span id="resendCooldown">(60s)</span>
                        </button>
                    </form>
                </div>

                <div class="text-center mt-3">
                    <a href="{{ url_for('auth.forgot_password') }}" class="text-decoration-none small">
                        <i class="bi bi-arrow-left me-1"></i>Change email
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Initialize OTP functionality
        const otpInputs = document.querySelectorAll('.otp-input');
        initOTPInputs(otpInputs);

        // Initialize timers
        const expirySeconds = {{ expiry_seconds|default (300)
    }};
    const resendCooldown = 60;

    // Start OTP expiry countdown
    startOTPTimer(expirySeconds);

    // Start resend cooldown
    startResendCooldown(resendCooldown);

    // Form validation
    document.getElementById('otpForm').addEventListener('submit', function (e) {
        const otp = collectOTP(otpInputs);
        if (otp.length !== 6) {
            e.preventDefault();
            otpInputs.forEach(input => input.classList.add('is-invalid'));
        }
    });
    });
</script>
{% endblock %}
