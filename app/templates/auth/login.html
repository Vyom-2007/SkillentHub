{% extends "base.html" %}
{% block title %}Log In — SkillentHub{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="auth-card animate-in">
        <div class="auth-header">
            <a href="/" class="auth-brand">
                <i class="bi bi-rocket-takeoff-fill"></i> SkillentHub
            </a>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Log in to your account</p>
        </div>

        <form id="login-form" action="{{ url_for('auth.login') }}" method="POST" novalidate>
            <!-- Email -->
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required
                    autocomplete="email">
                <label for="email"><i class="bi bi-envelope me-2"></i>Email Address</label>
                <div class="invalid-feedback" id="email-error"></div>
            </div>

            <!-- Password -->
            <div class="form-floating mb-4 position-relative">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password"
                    required autocomplete="current-password">
                <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
                <button type="button" class="password-toggle" id="toggle-password" tabindex="-1">
                    <i class="bi bi-eye"></i>
                </button>
                <div class="invalid-feedback" id="password-error"></div>
            </div>

            <div class="d-flex justify-content-end mb-3">
                <a href="{{ url_for('auth.forgot_password_page') }}" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-auth w-100" id="submit-btn">
                <span class="btn-text">Log In</span>
                <span class="btn-loader d-none">
                    <span class="spinner-border spinner-border-sm me-2" role="status"></span>Logging in...
                </span>
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.register_page') }}">Sign Up</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/validation.js') }}"></script>
{% endblock %}
