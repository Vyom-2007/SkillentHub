{% extends "base.html" %}
{% block title %}Forgot Password — SkillentHub{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="auth-card animate-in">
        <div class="auth-header">
            <a href="/" class="auth-brand">
                <i class="bi bi-rocket-takeoff-fill"></i> SkillentHub
            </a>
            <h1 class="auth-title">Forgot Password?</h1>
            <p class="auth-subtitle">Enter your email and we'll send you a reset code</p>
        </div>

        <form action="{{ url_for('auth.send_otp') }}" method="POST" novalidate>
            <!-- Email -->
            <div class="form-floating mb-4">
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required
                    autocomplete="email">
                <label for="email"><i class="bi bi-envelope me-2"></i>Email Address</label>
            </div>

            <button type="submit" class="btn btn-primary btn-auth w-100">
                <i class="bi bi-send me-2"></i>Send Reset Code
            </button>
        </form>

        <div class="auth-footer">
            Remember your password? <a href="{{ url_for('auth.login_page') }}">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
