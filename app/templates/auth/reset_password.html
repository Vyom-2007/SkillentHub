{% extends "base.html" %}
{% block title %}Reset Password — SkillentHub{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="auth-card animate-in">
        <div class="auth-header">
            <a href="/" class="auth-brand">
                <i class="bi bi-rocket-takeoff-fill"></i> SkillentHub
            </a>
            <h1 class="auth-title">Reset Password</h1>
            <p class="auth-subtitle">Choose a strong new password</p>
        </div>

        <form id="reset-form" action="{{ url_for('auth.reset_password') }}" method="POST" novalidate>
            <input type="hidden" name="email" value="{{ email }}">

            <!-- New Password -->
            <div class="form-floating mb-3 position-relative">
                <input type="password" class="form-control" id="password" name="password" placeholder="New password"
                    required autocomplete="new-password">
                <label for="password"><i class="bi bi-lock me-2"></i>New Password</label>
                <button type="button" class="password-toggle" id="toggle-password" tabindex="-1">
                    <i class="bi bi-eye"></i>
                </button>
                <div class="invalid-feedback" id="password-error"></div>
            </div>

            <!-- Password rules -->
            <div class="password-rules mb-3" id="password-rules">
                <div class="rule" id="rule-length">
                    <i class="bi bi-circle"></i> At least 8 characters
                </div>
                <div class="rule" id="rule-upper">
                    <i class="bi bi-circle"></i> 1 uppercase letter
                </div>
                <div class="rule" id="rule-number">
                    <i class="bi bi-circle"></i> 1 number
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-floating mb-4 position-relative">
                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                    placeholder="Confirm password" required autocomplete="new-password">
                <label for="confirm_password"><i class="bi bi-lock-fill me-2"></i>Confirm Password</label>
                <button type="button" class="password-toggle" id="toggle-confirm" tabindex="-1">
                    <i class="bi bi-eye"></i>
                </button>
                <div class="invalid-feedback" id="confirm-error"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-auth w-100" id="submit-btn">
                <span class="btn-text">Reset Password</span>
                <span class="btn-loader d-none">
                    <span class="spinner-border spinner-border-sm me-2" role="status"></span>Resetting...
                </span>
            </button>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('auth.login_page') }}">Back to Log In</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/validation.js') }}"></script>
{% endblock %}
