{% extends "layout.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold py-3">Create New Team</div>
                <div class="card-body p-4">
                    <form action="{{ url_for('teams.create_team') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Team Name</label>
                            <input type="text" class="form-control" name="team_name" required maxlength="100"
                                placeholder="e.g. The Code Wizards">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Event / Purpose</label>
                            <input type="text" class="form-control" name="event_name" required maxlength="100"
                                placeholder="e.g. HackMIT 2024 or Final Project">
                            <div class="form-text">What is this team for?</div>
                        </div>

                        <!-- Future: Max members, description, etc -->

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Create Team</button>
                            <a href="{{ url_for('teams.index') }}" class="btn btn-light">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
