{% extends "layout.html" %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">My Teams</h2>
        <a href="{{ url_for('teams.create_team') }}" class="btn btn-primary">Create New Team</a>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        {% for team in teams %}
        <div class="col">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title fw-bold mb-0">
                            <a href="{{ url_for('teams.view_team', team_id=team.team_id) }}"
                                class="text-decoration-none text-dark">
                                {{ team.team_name }}
                            </a>
                        </h5>
                        <span class="badge {{ 'bg-success' if team.role == 'leader' else 'bg-secondary' }}">
                            {{ team.role|title }}
                        </span>
                    </div>
                    <p class="card-text text-muted mb-3">{{ team.event_name }}</p>
                    <div class="mt-auto">
                        <a href="{{ url_for('teams.view_team', team_id=team.team_id) }}"
                            class="btn btn-outline-primary btn-sm w-100">View Team</a>
                    </div>
                </div>
            </div>
        </div>
        {% else %}
        <div class="col-12">
            <div class="text-center py-5 bg-white rounded shadow-sm">
                <p class="lead text-muted mb-3">You typically haven't joined any teams yet.</p>
                <a href="{{ url_for('teams.create_team') }}" class="btn btn-outline-primary">Create Your First Team</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
