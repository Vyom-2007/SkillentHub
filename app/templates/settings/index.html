{% extends "layout.html" %}

{% block content %}
<div class="container py-4">
    <h2 class="fw-bold mb-4">Settings</h2>

    <div class="row">
        <div class="col-md-3">
            <div class="list-group">
                <a href="#" class="list-group-item list-group-item-action active">Account</a>
                <a href="#" class="list-group-item list-group-item-action">Privacy</a>
                <a href="#" class="list-group-item list-group-item-action">Notifications</a>
            </div>
        </div>
        <div class="col-md-9">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold">Account Settings</div>
                <div class="card-body">
                    <form action="{{ url_for('settings.change_password') }}" method="POST">
                        <h6 class="mb-3">Change Password</h6>
                        <div class="mb-3">
                            <label class="form-label">Current Password</label>
                            <input type="password" name="current_password" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" name="new_password" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" name="confirm_password" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary">Update Password</button>
                    </form>

                    <hr class="my-4">

                    <h6 class="text-danger">Delete Account</h6>
                    <p class="text-muted small">Once you delete your account, there is no going back. Please be certain.
                    </p>
                    <button class="btn btn-outline-danger">Delete Account</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
