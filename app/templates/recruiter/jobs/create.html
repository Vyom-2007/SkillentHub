{% extends "base.html" %}
{% block title %}Post Opportunity{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>Post a New Opportunity</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

                    <div class="mb-3">
                        <label>Type</label>
                        <select name="type" class="form-select" id="typeSelect" onchange="toggleFields()">
                            <option value="job">Job</option>
                            <option value="internship">Internship</option>
                            <option value="competition">Competition / Hackathon</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Title</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>

                    <!-- Shared Fields -->
                    <div class="row mb-3" id="sharedLocMode">
                        <div class="col">
                            <label>Location</label>
                            <input type="text" name="location" class="form-control" required>
                        </div>
                        <div class="col">
                            <label>Work Mode</label>
                            <select name="work_mode" class="form-select">
                                <option value="On-site">On-site</option>
                                <option value="Remote">Remote</option>
                                <option value="Hybrid">Hybrid</option>
                            </select>
                        </div>
                    </div>

                    <!-- Job Specific -->
                    <div id="jobFields">
                        <div class="mb-3">
                            <label>Job Type</label>
                            <select name="job_type" class="form-select">
                                <option value="Full-time">Full-time</option>
                                <option value="Part-time">Part-time</option>
                                <option value="Contract">Contract</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Salary Range</label>
                            <input type="text" name="salary_range" class="form-control" placeholder="e.g. $50k - $70k">
                        </div>
                        <div class="mb-3">
                            <label>Experience Required (Years)</label>
                            <input type="text" name="experience_required" class="form-control">
                        </div>
                    </div>

                    <!-- Internship Specific -->
                    <div id="internshipFields" style="display:none;">
                        <div class="mb-3">
                            <label>Duration (Months)</label>
                            <input type="text" name="duration" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>Stipend</label>
                            <input type="text" name="stipend" class="form-control" placeholder="e.g. Unpaid or $/month">
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="certificate_provided" value="1"
                                id="certCheck">
                            <label class="form-check-label" for="certCheck">Certificate Provided</label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="ppo_possibility" value="1"
                                id="ppoCheck">
                            <label class="form-check-label" for="ppoCheck">PPO Possibility</label>
                        </div>
                    </div>

                    <!-- Competition Specific -->
                    <div id="competitionFields" style="display:none;">
                        <div class="mb-3">
                            <label>Competition Type</label>
                            <input type="text" name="type" class="form-control"
                                placeholder="Hackathon, Coding Challenge, Design Sprint">
                        </div>
                        <div class="mb-3">
                            <label>Prizes</label>
                            <textarea name="prizes" class="form-control"></textarea>
                        </div>
                        <div class="row">
                            <div class="col">
                                <label>Start Date</label>
                                <input type="date" name="start_date" class="form-control">
                            </div>
                            <div class="col">
                                <label>End Date</label>
                                <input type="date" name="end_date" class="form-control">
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label>Description</label>
                        <textarea name="description" class="form-control" rows="5" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label>Requirements</label>
                        <textarea name="requirements" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label>Skills Required (comma separated)</label>
                        <input type="text" name="skills_required" class="form-control" placeholder="Python, SQL, Flask">
                    </div>

                    <div class="mb-3">
                        <label>Application Deadline</label>
                        <input type="date" name="deadline" class="form-control">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Post</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleFields() {
        const type = document.getElementById('typeSelect').value;
        if (type === 'job') {
            document.getElementById('jobFields').style.display = 'block';
            document.getElementById('internshipFields').style.display = 'none';
            document.getElementById('competitionFields').style.display = 'none';
            document.getElementById('sharedLocMode').style.display = 'flex';
        } else if (type === 'internship') {
            document.getElementById('jobFields').style.display = 'none';
            document.getElementById('internshipFields').style.display = 'block';
            document.getElementById('competitionFields').style.display = 'none';
            document.getElementById('sharedLocMode').style.display = 'flex';
        } else {
            document.getElementById('jobFields').style.display = 'none';
            document.getElementById('internshipFields').style.display = 'none';
            document.getElementById('competitionFields').style.display = 'block';
        }
    }
</script>
{% endblock %}
