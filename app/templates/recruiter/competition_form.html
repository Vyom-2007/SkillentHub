{% extends "base_recruiter.html" %}

{% block title %}Create Competition - Recruiter Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                    <h4 class="fw-bold text-warning"><i class="bi bi-trophy me-2"></i>Create Competition</h4>
                    <p class="text-muted small">Host a competitive event or challenge</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('recruiter.create_competition') }}" class="needs-validation"
                        novalidate id="postForm">

                        <!-- Basic Info -->
                        <div class="mb-3">
                            <label class="form-label">Competition Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="title" required
                                placeholder="e.g. Annual Coding Challenge">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description <span class="text-danger">*</span></label>
                            <textarea class="form-control" name="description" rows="4" required maxlength="5000"
                                id="descInput"></textarea>
                            <div class="form-text text-end"><span id="descCount">0</span>/5000 characters</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Rules & Guidelines <span class="text-danger">*</span></label>
                            <textarea class="form-control" name="rules" rows="4" required
                                placeholder="Enter competition rules..."></textarea>
                        </div>

                        <!-- Schedule & Logistics -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Start Date & Time <span class="text-danger">*</span></label>
                                <input type="datetime-local" class="form-control" name="start_date" required
                                    id="startDateInput">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">End Date & Time <span class="text-danger">*</span></label>
                                <input type="datetime-local" class="form-control" name="end_date" required
                                    id="endDateInput">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Prize Details <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="prize_details" required
                                    placeholder="e.g. $5000 First Prize">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Max Participants <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" name="max_participants" min="1" required
                                    placeholder="Optional">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="{{ url_for('recruiter.dashboard') }}" class="btn btn-light">Cancel</a>
                            <button type="submit" class="btn btn-warning text-dark px-4">Create Competition</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/recruiter_forms.js') }}"></script>
{% endblock %}
