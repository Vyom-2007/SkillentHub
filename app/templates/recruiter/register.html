{% extends "base.html" %}

{% block title %}Recruiter Registration - SkillentHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-primary">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Recruiter Registration</h4>
            </div>
            <div class="card-body">
                <form action="{{ url_for('recruiter_auth.register') }}" method="POST" id="recruiterRegisterForm"
                    novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

                    <div class="mb-3">
                        <label for="full_name" class="form-label">Full Name / Company Name</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Work Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                        <div class="form-text">Min 8 chars, 1 uppercase, 1 number.</div>
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                            required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Register as Recruiter</button>
                </form>
            </div>
            <div class="card-footer text-center bg-white">
                Already have an account? <a href="{{ url_for('recruiter_auth.login') }}">Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
