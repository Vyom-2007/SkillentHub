{% extends "base_recruiter.html" %}

{% block title %}Post New Job - Recruiter Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                    <h4 class="mb-0 fw-bold text-primary"><i class="bi bi-briefcase me-2"></i>Post New Job</h4>
                    <p class="text-muted small">Create a new job listing for candidates</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('recruiter.create_job') }}" class="needs-validation"
                        novalidate id="postForm">

                        <!-- Basic Info -->
                        <h6 class="text-uppercase text-muted fw-bold mb-3 fs-7">Basic Information</h6>
                        <div class="mb-3">
                            <label class="form-label">Job Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="title" required
                                placeholder="e.g. Senior Software Engineer">
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Location <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="location" required
                                    placeholder="City, State">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Job Type <span class="text-danger">*</span></label>
                                <select class="form-select" name="job_type" required>
                                    <option value="">Select Type</option>
                                    <option value="full-time">Full-time</option>
                                    <option value="part-time">Part-time</option>
                                    <option value="contract">Contract</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Work Mode <span class="text-danger">*</span></label>
                                <select class="form-select" name="work_mode" required>
                                    <option value="on-site">On-site</option>
                                    <option value="remote">Remote</option>
                                    <option value="hybrid">Hybrid</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Experience</label>
                                <select class="form-select" name="experience_required">
                                    <option value="0-1">0-1 Years</option>
                                    <option value="1-3">1-3 Years</option>
                                    <option value="3-5">3-5 Years</option>
                                    <option value="5-10">5-10 Years</option>
                                    <option value="10+">10+ Years</option>
                                </select>
                            </div>
                        </div>

                        <!-- Details -->
                        <h6 class="text-uppercase text-muted fw-bold mb-3 mt-4 fs-7">Job Details</h6>

                        <div class="mb-3">
                            <label class="form-label">Skills Required</label>
                            <input type="text" class="form-control" name="skills_required"
                                placeholder="e.g. Python, Flask, React (Comma separated)">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Salary Range</label>
                            <input type="text" class="form-control" name="salary_range"
                                placeholder="e.g. $80k - $100k or Market Rate">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description <span class="text-danger">*</span></label>
                            <textarea class="form-control" name="description" rows="5" required maxlength="5000"
                                id="descInput"></textarea>
                            <div class="form-text text-end"><span id="descCount">0</span>/5000 characters</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Requirements</label>
                            <textarea class="form-control" name="requirements" rows="4"></textarea>
                        </div>

                        <!-- Settings -->
                        <h6 class="text-uppercase text-muted fw-bold mb-3 mt-4 fs-7">Settings</h6>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Application Deadline</label>
                                <input type="date" class="form-control" name="deadline" id="deadlineInput">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Number of Openings</label>
                                <input type="number" class="form-control" name="openings" value="1" min="1">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('recruiter.dashboard') }}" class="btn btn-light">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Post Job</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/recruiter_forms.js') }}"></script>
{% endblock %}
