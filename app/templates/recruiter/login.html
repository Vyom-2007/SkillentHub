{% extends "base.html" %}

{% block title %}Recruiter Login - SkillentHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-primary">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Recruiter Login</h4>
            </div>
            <div class="card-body">
                <form action="{{ url_for('recruiter_auth.login') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

                    <div class="mb-3">
                        <label for="email" class="form-label">Work Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Login to Dashboard</button>

                    <div class="mt-3 text-center">
                        <a href="{{ url_for('recruiter_auth.forgot_password') }}">Forgot Password?</a>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center bg-white">
                New Recruiter? <a href="{{ url_for('recruiter_auth.register') }}">Register Here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
