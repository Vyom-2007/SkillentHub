{% extends "base.html" %}

{% block title %}Recruiter Forgot Password - SkillentHub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="auth-card">
                <div class="text-center mb-4">
                    <div class="mb-3">
                        <i class="bi bi-briefcase-fill fs-1" style="color: var(--primary-color);"></i>
                    </div>
                    <h1 class="auth-title">Recruiter Password Reset</h1>
                    <p class="auth-subtitle">Enter your company email and we'll send you an OTP to reset your password
                    </p>
                </div>

                <form method="POST" action="{{ url_for('auth_recruiter.forgot_password') }}">
                    <!-- Email -->
                    <div class="mb-4">
                        <label for="email" class="form-label">Company Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}"
                            placeholder="recruiter@company.com" required autofocus>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-envelope me-2"></i>Send OTP
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{{ url_for('auth_recruiter.login') }}" class="text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>Back to Recruiter Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
