{% extends "base_recruiter.html" %}

{% block title %}Post Internship - Recruiter Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                    <h4 class="fw-bold text-info"><i class="bi bi-laptop me-2"></i>Post Internship</h4>
                    <p class="text-muted small">Create a new internship opportunity</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('recruiter.create_internship') }}" class="needs-validation"
                        novalidate id="postForm">

                        <!-- Basic Info -->
                        <div class="mb-3">
                            <label class="form-label">Internship Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="title" required
                                placeholder="e.g. Frontend Intern">
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Location <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="location" required
                                    placeholder="City, State">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Work Mode <span class="text-danger">*</span></label>
                                <select class="form-select" name="work_mode" required>
                                    <option value="on-site">On-site</option>
                                    <option value="remote">Remote</option>
                                    <option value="hybrid">Hybrid</option>
                                </select>
                            </div>
                        </div>

                        <!-- Internship Details -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Duration <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="duration" required
                                    placeholder="e.g. 3 Months, 6 Months">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Stipend <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="stipend" required
                                    placeholder="e.g. $1000/month or Unpaid">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Openings <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" name="openings" value="1" min="1" required>
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="certificateCheck"
                                name="certificate_provided">
                            <label class="form-check-label" for="certificateCheck">Certificate Provided</label>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Skills Required <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="skills_required" required
                                placeholder="e.g. Java, Spring Boot">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description <span class="text-danger">*</span></label>
                            <textarea class="form-control" name="description" rows="5" required maxlength="5000"
                                id="descInput"></textarea>
                            <div class="form-text text-end"><span id="descCount">0</span>/5000 characters</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Requirements</label>
                            <textarea class="form-control" name="requirements" rows="4"></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Application Deadline <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" name="deadline" id="deadlineInput" required>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('recruiter.dashboard') }}" class="btn btn-light">Cancel</a>
                            <button type="submit" class="btn btn-info text-white px-4">Post Internship</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/recruiter_forms.js') }}"></script>
{% endblock %}
