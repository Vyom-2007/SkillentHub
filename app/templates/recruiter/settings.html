{% extends "base_recruiter.html" %}

{% block title %}Settings - Recruiter Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <h4 class="mb-4">Account Settings</h4>

    <div class="row g-4">
        <!-- Company Profile Settings -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white fw-bold py-3">Company Profile</div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('recruiter.update_profile') }}">
                        <div class="mb-3">
                            <label class="form-label">Company Email</label>
                            <input type="email" class="form-control" value="{{ profile.company_email }}" disabled
                                readonly>
                            <div class="form-text">Email cannot be changed. Contact support for assistance.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Company Name</label>
                            <input type="text" class="form-control" name="company_name"
                                value="{{ profile.company_name }}" required>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Security Settings -->
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white fw-bold py-3">Security</div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('recruiter.change_password') }}">
                        <div class="mb-3">
                            <label class="form-label">Current Password</label>
                            <input type="password" class="form-control" name="current_password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control" name="new_password" required>
                            <div class="form-text">Must be at least 8 characters, with 1 uppercase letter and 1 number.
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" name="confirm_password" required>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-danger text-white">Change Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
