{% extends "layout.html" %}

{% block content %}
<div class="container py-4">
    <h2 class="fw-bold mb-4">Opportunities</h2>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        {% for opp in opportunities %}
        <div class="col">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title fw-bold text-primary">{{ opp.title }}</h5>
                    <h6 class="card-subtitle mb-2 text-muted">{{ opp.organization }}</h6>
                    <p class="card-text">{{ opp.description }}</p>
                    <p class="small text-muted">Date: {{ opp.date }}</p>
                </div>
                <div class="card-footer bg-white border-0">
                    <a href="{{ opp.link }}" class="btn btn-outline-primary w-100">View Details</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
