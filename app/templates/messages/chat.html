{% extends "base.html" %}
{% block title %}Chat with {{ partner.full_name }}{% endblock %}
{% block content %}
<div class="row h-100">
    <div class="col-md-12 h-100 d-flex flex-column" style="height: 80vh !important;">
        <!-- Header -->
        <div class="card-header bg-white border-bottom d-flex align-items-center mb-3">
            <a href="{{ url_for('messages.index') }}" class="btn btn-sm btn-outline-secondary me-3">Back</a>
            <img src="{{ url_for('uploaded_file', filename='profiles/' + partner.profile_picture) if partner.profile_picture else 'https://via.placeholder.com/40' }}"
                width="40" height="40" class="rounded-circle me-2">
            <h5 class="mb-0">{{ partner.full_name }}</h5>
        </div>

        <!-- Messages Area -->
        <div class="flex-grow-1 overflow-auto p-3 mb-3 border rounded bg-light" id="chatArea" style="max-height: 60vh;">
            {% for m in messages %}
            <div
                class="d-flex mb-2 {{ 'justify-content-end' if m.sender_id == session['user_id'] else 'justify-content-start' }}">
                <div class="p-2 rounded {{ 'bg-primary text-white' if m.sender_id == session['user_id'] else 'bg-white border' }}"
                    style="max-width: 70%;">
                    {{ m.content }}
                    <div class="text-end" style="font-size: 0.7em; opacity: 0.7;">{{ m.created_at }}</div>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Input Area -->
        <div class="input-group">
            <input type="text" id="msgInput" class="form-control" placeholder="Type a message...">
            <button class="btn btn-primary" id="sendBtn">Send</button>
        </div>
    </div>
</div>

<script>
    const PARTNER_ID = {{ partner.user_id }};
    const MY_ID = {{ session['user_id'] }};
</script>
<script src="{{ url_for('static', filename='js/messages.js') }}"></script>
{% endblock %}
