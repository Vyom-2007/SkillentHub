{% extends "layout.html" %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-4">Connection Requests</h2>

    <div class="row">
        {% for req in requests %}
        <div class="col-md-6 mb-3">
            <div class="card shadow-sm">
                <div class="card-body d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center">
                        <img src="{{ url_for('static', filename=req.profile_picture) if req.profile_picture else 'https://via.placeholder.com/60' }}"
                            class="rounded-circle me-3" style="width: 60px; height: 60px; object-fit: cover;">
                        <div>
                            <h5 class="mb-1"><a href="{{ url_for('profile.view_profile', user_id=req.user_id) }}"
                                    class="text-decoration-none">{{ req.full_name }}</a></h5>
                            <p class="text-muted small mb-0">{{ req.headline }}</p>
                        </div>
                    </div>
                    <div>
                        <form action="{{ url_for('connections.accept_request', conn_id=req.connection_id) }}"
                            method="POST" class="d-inline">
                            <button type="submit" class="btn btn-primary btn-sm">Accept</button>
                        </form>
                        <button class="btn btn-outline-secondary btn-sm">Ignore</button>
                    </div>
                </div>
            </div>
        </div>
        {% else %}
        <div class="col-12">
            <p class="text-muted">No pending requests.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
